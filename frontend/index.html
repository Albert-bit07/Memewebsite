<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="status-bar">
        <div class="status-item">
            ❤️ <span id="likedCount">0</span>
        </div>
        <div class="status-item">
            📚 <span id="totalCount">0</span>
        </div>
    </div>

    <div class="ranking-control">
    <label for="rankingStrategy">Feed order</label>
    <select id="rankingStrategy" onchange="getRecommendations()">
        <option value="exact">Similarity</option>
        <option value="balanced">Variety + exploration</option>
    </select>
    </div>

    <button class="refresh-btn" onclick="getRecommendations()" title="Refresh recommendations">
        ↻
    </button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading memes...</p>
    </div>

    <div class="feed-container" id="feedContainer">
        <!-- Memes will be loaded here -->
    </div>

    <script src="script.js"></script>
</body>
</html>
