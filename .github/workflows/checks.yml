name: C++ and HTTP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pybind11
      - run: cmake -S . -B /tmp/meme-build -DPython3_EXECUTABLE=$(which python)
      - run: cmake --build /tmp/meme-build -j2
      - run: ctest --test-dir /tmp/meme-build --output-on-failure
      - run: python tests/server_smoke.py /tmp/meme-build/backend/cpp/recommender
