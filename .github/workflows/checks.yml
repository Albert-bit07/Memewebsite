name: C++ and HTTP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-embedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --locked --project backend/python
      - run: uv pip check --python backend/python/.venv/bin/python
      - run: uv run --locked --project backend/python python tests/embedding_smoke.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=ON
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/frontend_test.cjs
      - run: python tests/server_smoke.py build/backend/cpp/recommender
      - run: python tests/catalog_reload.py build/backend/cpp/recommender
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: build/backend/cpp/retrieval_benchmark
